name: jarvis-web

# The project half of the deployment: its own Postgres and app, no public ports.
# `edge` (../../edge/docker-compose.yml) is the only thing that listens on :80/:443 and holds the certificates.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    # No `ports`: the database is reachable only from the compose network.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    # `build` is for building here (or in CI); `image` lets the server skip building entirely:
    #   local/CI: docker compose build --push app     server: docker compose pull && up -d --no-build
    image: ghcr.io/ram0973/jarvis-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      edge:
        # This alias is what Caddy proxies to: `reverse_proxy jarvis-web:3000` in deploy/edge/sites/*.caddy.
        aliases:
          - jarvis-web
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  # Created by the edge stack (or once by hand: `docker network create edge`). Every project joins the same one.
  edge:
    external: true
    name: edge

volumes:
  db_data:
  uploads:
