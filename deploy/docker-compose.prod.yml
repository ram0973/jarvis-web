name: jarvis-web

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    # No `ports`: the database is reachable only from the compose network.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      UPLOADS_DIR: /data/uploads
    # Bound to loopback: TLS and the public port belong to Caddy.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
